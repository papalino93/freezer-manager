<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    background: linear-gradient(135deg, #fbf7f1 0%, #f3ebdd 100%);
    font-family: "Nunito", "Segoe UI", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .decor {
    position: absolute;
    border-radius: 999px;
    background: #0f7a72;
    opacity: 0.06;
  }
  .decor.d1 { width: 520px; height: 520px; top: -180px; left: -160px; }
  .decor.d2 { width: 380px; height: 380px; bottom: -160px; right: -120px; }
  .card {
    display: flex;
    align-items: center;
    gap: 56px;
    z-index: 1;
  }
  .logo {
    width: 220px;
    height: 220px;
    border-radius: 52px;
    box-shadow: 0 24px 60px rgba(15, 122, 114, 0.25);
    flex-shrink: 0;
    overflow: hidden;
  }
  .logo svg { width: 100%; height: 100%; display: block; }
  .text h1 {
    font-size: 64px;
    font-weight: 800;
    color: #2c2620;
    line-height: 1.1;
    margin-bottom: 18px;
  }
  .text p {
    font-size: 28px;
    font-weight: 600;
    color: #77695c;
    max-width: 560px;
    line-height: 1.4;
  }
</style>
</head>
<body>
  <div class="decor d1"></div>
  <div class="decor d2"></div>
  <div class="card">
    <div class="logo">__LOGO_SVG__</div>
    <div class="text">
      <h1>Il Mio Congelatore 🧊</h1>
      <p>Il modo semplice per sapere sempre cosa hai nel congelatore.</p>
    </div>
  </div>
</body>
</html>
